<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Untuk Kamu 🤍</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}
body{overflow:hidden;display:flex;justify-content:center;align-items:center;
background:radial-gradient(circle at 50% 15%,#29234f 0%,#121027 42%,#05050d 100%);
font-family:Georgia,serif;color:white}
.sky,.flowers{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.sky{z-index:1}.flowers{z-index:20}
.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;
box-shadow:0 0 8px white;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.5)}}
.shooting-star{position:absolute;width:110px;height:2px;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));
transform:rotate(-35deg);opacity:0;animation:shoot 5s linear infinite}
@keyframes shoot{0%{transform:translate(0,0) rotate(-35deg);opacity:0}
10%{opacity:1}35%{transform:translate(-400px,250px) rotate(-35deg);opacity:0}100%{opacity:0}}
.flower{position:absolute;top:-50px;animation:fall linear forwards;opacity:.9}
@keyframes fall{0%{transform:translateY(-60px) rotate(0);opacity:0}
10%{opacity:1}50%{transform:translateY(50vh) translateX(40px) rotate(180deg)}
100%{transform:translateY(110vh) translateX(-40px) rotate(360deg);opacity:0}}
.start{position:relative;z-index:30;padding:17px 32px;border:1px solid rgba(255,255,255,.25);
border-radius:50px;color:white;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);
font:17px Georgia,serif;box-shadow:0 0 20px rgba(255,255,255,.12);cursor:pointer;transition:.4s}
.start:hover{transform:scale(1.08);box-shadow:0 0 35px rgba(255,255,255,.3)}
.letter{display:none;position:relative;z-index:10;width:90%;max-width:650px;max-height:82vh;
overflow-y:auto;padding:35px 25px;border-radius:22px;background:rgba(18,16,39,.82);
backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.16);
box-shadow:0 0 60px rgba(170,140,255,.2),inset 0 0 30px rgba(255,255,255,.03);
animation:open 1.4s ease}
@keyframes open{0%{opacity:0;transform:translateY(40px) scale(.85) rotateX(10deg)}
100%{opacity:1;transform:translateY(0) scale(1) rotateX(0)}}
.letter::-webkit-scrollbar{width:4px}.letter::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:10px}
.title{text-align:center;font-size:28px;margin-bottom:25px;text-shadow:0 0 10px rgba(255,255,255,.4),0 0 25px rgba(200,180,255,.3)}
#text{font-size:17px;line-height:1.9;text-align:center;white-space:pre-line}
.cursor{display:inline-block;width:2px;height:18px;background:white;margin-left:3px;animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
.heart{text-align:center;font-size:30px;margin-top:25px;animation:heartbeat 1.5s infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.25);filter:drop-shadow(0 0 12px pink)}}
@media(max-width:480px){.letter{width:92%;max-height:80vh;padding:28px 20px}.title{font-size:24px}#text{font-size:16px;line-height:1.8}.start{font-size:16px}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="flowers" id="flowers"></div>

<div class="letter" id="letter">
<div class="title">✨ Untuk Kamu ✨</div>
<div id="text"></div><span class="cursor"></span>

</div>

<script>
const sky=document.getElementById("sky"), flowers=document.getElementById("flowers");
const bunga=["🌸","🌷","🌹","🌺","🌼"];
for(let i=0;i<130;i++){let s=document.createElement("div");s.className="star";
s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";
s.style.animationDelay=Math.random()*3+"s";s.style.animationDuration=(1+Math.random()*3)+"s";sky.appendChild(s)}
for(let i=0;i<5;i++){let s=document.createElement("div");s.className="shooting-star";
s.style.left=(65+Math.random()*35)+"%";s.style.top=Math.random()*40+"%";
s.style.animationDelay=Math.random()*6+"s";s.style.animationDuration=(4+Math.random()*3)+"s";sky.appendChild(s)}
function createFlower(){let f=document.createElement("div");f.className="flower";
f.textContent=bunga[Math.floor(Math.random()*bunga.length)];
f.style.left=Math.random()*100+"vw";f.style.fontSize=(16+Math.random()*15)+"px";
f.style.animationDuration=(5+Math.random()*6)+"s";flowers.appendChild(f);setTimeout(()=>f.remove(),11000)}

const message=`Hei, kamu... 🌷

Aku nggak tahu seberapa berat hari-hari yang sedang kamu jalani sekarang.

Mungkin ada banyak hal yang kamu simpan sendiri.
Banyak cerita yang kamu pilih untuk diamkan,
dan banyak rasa yang nggak sempat kamu ceritakan kepada siapa-siapa.

Tapi aku harap, di tengah semua itu,
kamu nggak pernah lupa satu hal:

Kamu sudah melakukan yang terbaik yang kamu bisa. 🤍

Kalau hari ini kamu belum bisa tersenyum,
nggak apa-apa.

Kalau hari ini kamu cuma mampu bertahan,
itu juga nggak apa-apa.

Kamu nggak harus selalu terlihat kuat
hanya supaya orang lain menganggapmu hebat.

Kadang menjadi kuat bukan tentang
terus berjalan tanpa berhenti.

Kadang menjadi kuat adalah ketika kamu berkata:

"Aku capek...
tapi aku akan mencoba lagi besok."

Jadi kalau suatu hari semuanya terasa terlalu berat,
istirahatlah.

Tarik napas pelan-pelan.

Lihat langit.

Dan ingat...

Satu hari yang buruk nggak akan menentukan seluruh hidupmu.

Masih ada banyak pagi yang belum kamu lihat.
Masih ada banyak tempat yang belum kamu datangi.
Masih ada banyak tawa yang belum kamu rasakan.

Dan masih ada banyak hal indah
yang belum sempat menemukanmu.

Jadi jangan buru-buru menyerah
pada cerita yang bahkan belum selesai. 🌻

Teruslah berjalan,
walaupun pelan.

Nggak harus sempurna.
Nggak harus selalu kuat.

Cukup menjadi dirimu sendiri
dan terus mencoba.

Karena tanpa kamu sadari...

Ada seseorang yang bangga
melihatmu tetap bertahan sampai hari ini.

Dan kalau hari ini belum ada
yang mengatakan itu kepadamu...

Aku bangga sama kamu. 🤍

Jaga dirimu baik-baik, ya.

Semoga langkahmu selalu dipertemukan
dengan hal-hal baik.

Semoga hatimu selalu menemukan
alasan untuk tersenyum.

Dan semoga suatu hari nanti
kamu bisa melihat ke belakang sambil berkata:

"Ternyata...
aku berhasil melewati semuanya."

✨ Semangat, ya.

Pelan-pelan aja...
kamu nggak sedang berlomba dengan siapa-siapa. 🌷`;

document.getElementById("start").addEventListener("click",function(){
this.style.display="none";
document.getElementById("letter").style.display="block";
const music=document.getElementById("musik"); music.volume=.65;
music.play().catch(()=>{});
for(let i=0;i<10;i++)setTimeout(createFlower,i*220);
setInterval(createFlower,450);
let i=0; const text=document.getElementById("text");
function type(){if(i<message.length){text.textContent+=message.charAt(i++);
let d=message.charAt(i-1)==="\n"?500:message.charAt(i-1)==="."?120:32;setTimeout(type,d)}}
type();
});
</script>
